name: Build Avora APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Avora APK (Optimized Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Avora-Music-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --console=plain 2>&1 | tee release.log

      - name: Ringkasan error release
        if: failure()
        run: grep -n -B2 -A12 -E "What went wrong|Missing class|error:" release.log | head -80 || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Avora-Music-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
